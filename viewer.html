<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>MusicXML 미리보기</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.7.6/build/opensheetmusicdisplay.min.js"></script>
  <style>
    :root {
      --bg: #f6f8fc;
      --card: #ffffff;
      --border: #e2e8f0;
      --primary: #1a3a6b;
      --primary-light: #2d5aa0;
      --text: #1e293b;
      --text-muted: #64748b;
      --link: #2563eb;
      --radius: 12px;
      --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }

    /* Header */
    header {
      background: linear-gradient(135deg, #0f2447 0%, #1a3a6b 50%, #2d5aa0 100%);
      color: #fff;
      padding: 1.25rem 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem 1.25rem;
    }
    .title {
      flex: 1 1 auto;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .filename {
      display: block;
      margin-top: 0.2rem;
      font-size: 0.82rem;
      color: rgba(255,255,255,0.6);
      font-weight: 400;
    }

    /* Buttons */
    .header-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s ease;
      border: none;
      cursor: pointer;
    }
    .back-btn {
      background: rgba(255,255,255,0.12);
      color: #fff;
    }
    .back-btn:hover { background: rgba(255,255,255,0.22); }
    .download-btn {
      background: #c8913a;
      color: #fff;
    }
    .download-btn:hover { background: #b07e2f; }

    /* Player */
    .player-controls {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .player-controls button {
      background: rgba(255,255,255,0.15);
      color: #fff;
      padding: 0.4rem 0.85rem;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .player-controls button:hover:not([disabled]) { background: rgba(255,255,255,0.28); }
    .player-controls button:disabled { opacity: 0.35; cursor: not-allowed; }

    /* Score */
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 1.5rem;
    }
    #score {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      overflow-x: auto;
      box-shadow: var(--shadow-md);
    }
    #message {
      margin: 2rem auto;
      max-width: 960px;
      padding: 1.25rem 1.5rem;
      border-radius: var(--radius);
      border: 1px solid #fecaca;
      background: #fef2f2;
      color: #991b1b;
      font-size: 0.9rem;
    }

    /* Footer */
    .site-footer {
      max-width: 960px;
      margin: 2rem auto 0;
      padding: 1.5rem 0;
      font-size: 0.82rem;
      color: var(--text-muted);
      text-align: center;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 768px) {
      header { padding: 1rem 1.25rem; }
      .container { padding: 1rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">MusicXML 미리보기<span id="current-file" class="filename"></span></div>
    <div class="player-controls">
      <button id="play-btn" type="button" disabled>재생</button>
      <button id="pause-btn" type="button" disabled>일시정지</button>
      <button id="stop-btn" type="button" disabled>정지</button>
    </div>
    <a class="header-btn back-btn" href="index.html">← 목록</a>
    <a id="download-link" class="header-btn download-btn" href="#" download>다운로드</a>
  </header>
  <div id="message" hidden></div>
  <div class="container">
    <div id="score"></div>
  </div>
  <footer class="site-footer">© 2025 Jeongganbo Dataset. 제작자: 한단비내린</footer>
  <script>
    (async function() {
      const params = new URLSearchParams(window.location.search);
      const fileParam = params.get('file');
      if (!fileParam) {
        showError('불러올 MusicXML 파일 경로가 제공되지 않았습니다.');
        return;
      }

      const requestUrl = fileParam;
      const decodedName = decodeURIComponent(requestUrl.split('/').pop() || '');
      const INSTRUMENT_CODE_MAP = {
        daegeum: '대금',
        piri: '피리',
        haegeum: '해금',
        ajaeng: '아쟁',
        gayageum: '가야금',
        geomungo: '거문고',
      };
      const friendlyTitle = extractFriendlyTitle(decodedName, INSTRUMENT_CODE_MAP);
      const displayTitle = friendlyTitle || decodedName;

      const downloadLink = document.getElementById('download-link');
      downloadLink.href = requestUrl;
      downloadLink.setAttribute('download', decodedName || 'musicxml_file.musicxml');

      const currentFileEl = document.getElementById('current-file');
      currentFileEl.textContent = displayTitle;
      if (decodedName) {
        currentFileEl.setAttribute('title', decodedName);
        downloadLink.title = decodedName;
      }
      if (displayTitle) {
        document.title = `MusicXML 미리보기 - ${displayTitle}`;
      }

      const playBtn = document.getElementById('play-btn');
      const pauseBtn = document.getElementById('pause-btn');
      const stopBtn = document.getElementById('stop-btn');
      let osmd = null;
      let audioPlayer = null;
      disablePlayerControls();

      try {
        const response = await fetch(requestUrl);
        if (!response.ok) {
          throw new Error('파일을 불러올 수 없습니다. (HTTP ' + response.status + ')');
        }
        const musicXml = await response.text();
        const instrumentNames = extractInstrumentNames(decodedName, INSTRUMENT_CODE_MAP);
        osmd = await renderScore(musicXml, instrumentNames, friendlyTitle);
        await setupAudioPlayer(osmd);
      } catch (err) {
        console.error(err);
        showError('MusicXML을 렌더링하는 동안 오류가 발생했습니다. 파일 경로나 형식을 확인하세요.');
        return;
      }

      playBtn.addEventListener('click', async () => {
        if (!audioPlayer) return;
        try {
          await audioPlayer.play();
        } catch (err) {
          console.error(err);
          alert('재생을 시작할 수 없습니다. 브라우저 설정을 확인하거나 다시 시도해 주세요.');
        }
      });

      pauseBtn.addEventListener('click', async () => {
        if (!audioPlayer) return;
        try {
          await audioPlayer.pause();
        } catch (err) {
          console.error(err);
        }
      });

      stopBtn.addEventListener('click', async () => {
        if (!audioPlayer) return;
        try {
          await audioPlayer.stop();
          if (osmd?.cursor) {
            osmd.cursor.reset();
            osmd.cursor.hide();
          }
        } catch (err) {
          console.error(err);
        }
      });

      function showError(msg) {
        const messageEl = document.getElementById('message');
        messageEl.textContent = msg;
        messageEl.hidden = false;
        document.getElementById('score').style.display = 'none';
        disablePlayerControls();
      }

      function extractInstrumentNames(filename, codeMap) {
        if (!filename) return [];
        const match = filename.match(/_([a-z_]+)\.musicxml$/i);
        if (!match) return [];
        return match[1]
          .split('_')
          .map(code => codeMap[code.toLowerCase()] || null)
          .filter(Boolean);
      }

      function extractFriendlyTitle(filename, codeMap) {
        if (!filename) return '';
        const withoutExt = filename.replace(/\.musicxml$/i, '');
        const segments = withoutExt.split('_');
        const titleSegments = [];
        for (const segment of segments) {
          const lower = segment.toLowerCase();
          if (codeMap[lower]) {
            break;
          }
          titleSegments.push(segment);
        }
        const rawTitle = titleSegments.join('_').trim();
        const normalized = rawTitle.replace(/_/g, ' ').replace(/\s+/g, ' ').trim();
        if (normalized) {
          return normalized;
        }
        return withoutExt.replace(/_/g, ' ').trim();
      }

      async function renderScore(musicXml, instrumentNames, friendlyTitle) {
        const container = document.getElementById('score');
        const useInstrumentNames = Array.isArray(instrumentNames) && instrumentNames.length > 0;
        const osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay(container, {
          drawingParameters: 'default',
          drawTitle: true,
          drawPartNames: useInstrumentNames,
          drawPartAbbreviations: useInstrumentNames,
        });
        const processedMusicXml = overrideTitleInMusicXml(musicXml, friendlyTitle);
        await osmd.load(processedMusicXml);

        if (useInstrumentNames && Array.isArray(osmd.sheet && osmd.sheet.Instruments)) {
          const instruments = osmd.sheet.Instruments;
          const parts = osmd.sheet && osmd.sheet.Parts ? osmd.sheet.Parts : [];
          instruments.forEach((instrument, idx) => {
            const name = instrumentNames[idx];
            if (!name || !instrument) return;
            instrument.Name = name;
            instrument.ShortName = name;
            if (instrument.PartListEntry) {
              instrument.PartListEntry.PartName = name;
              instrument.PartListEntry.PartAbbreviation = name;
            }
            const part = parts[idx];
            if (part) {
              part.PartName = name;
              part.PartAbbreviation = name;
              if (part.PartListEntry) {
                part.PartListEntry.PartName = name;
                part.PartListEntry.PartAbbreviation = name;
              }
            }
          });
        }

        osmd.render();
        return osmd;
      }

      function overrideTitleInMusicXml(xmlString, title) {
        if (!title) return xmlString;
        try {
          const escapedTitle = title
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
          let xml = xmlString;

          const movementRegex = /<movement-title[^>]*>[\s\S]*?<\/movement-title>/i;
          if (movementRegex.test(xml)) {
            xml = xml.replace(movementRegex, `<movement-title>${escapedTitle}</movement-title>`);
          } else {
            const movementNumberRegex = /<movement-number[^>]*>[\s\S]*?<\/movement-number>/i;
            if (movementNumberRegex.test(xml)) {
              xml = xml.replace(
                movementNumberRegex,
                match => `${match}\n  <movement-title>${escapedTitle}</movement-title>`
              );
            } else {
              const scorePartwiseRegex = /<score-partwise[^>]*>/i;
              if (scorePartwiseRegex.test(xml)) {
                xml = xml.replace(
                  scorePartwiseRegex,
                  match => `${match}\n  <movement-title>${escapedTitle}</movement-title>`
                );
              }
            }
          }

          const workTitleRegex = /<work-title[^>]*>[\s\S]*?<\/work-title>/i;
          if (workTitleRegex.test(xml)) {
            xml = xml.replace(workTitleRegex, `<work-title>${escapedTitle}</work-title>`);
          } else {
            const workTagRegex = /<work[^>]*>/i;
            if (workTagRegex.test(xml)) {
              xml = xml.replace(
                workTagRegex,
                match => `${match}\n    <work-title>${escapedTitle}</work-title>`
              );
            }
          }

          return xml;
        } catch (err) {
          console.warn('Title override failed:', err);
          return xmlString;
        }
      }

      async function setupAudioPlayer(osmdInstance) {
        if (!osmdInstance || !opensheetmusicdisplay?.AudioPlayer) {
          console.warn('OSMD AudioPlayer is unavailable; 재생 기능을 비활성화합니다.');
          disablePlayerControls();
          return;
        }
        try {
          audioPlayer = new opensheetmusicdisplay.AudioPlayer();
          await audioPlayer.init(osmdInstance);
          enablePlayerControls();
        } catch (err) {
          console.error('AudioPlayer 초기화 실패:', err);
          disablePlayerControls();
        }
      }

      function disablePlayerControls() {
        if (playBtn && pauseBtn && stopBtn) {
          playBtn.disabled = true;
          pauseBtn.disabled = true;
          stopBtn.disabled = true;
        }
      }

      function enablePlayerControls() {
        if (playBtn && pauseBtn && stopBtn) {
          playBtn.disabled = false;
          pauseBtn.disabled = false;
          stopBtn.disabled = false;
        }
      }
    })();
  </script>
</body>
</html>
