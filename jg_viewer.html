<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>정간보 미리보기</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f8fc;
      --card: #ffffff;
      --border: #e2e8f0;
      --primary: #1a3a6b;
      --primary-light: #2d5aa0;
      --text: #1e293b;
      --text-muted: #64748b;
      --radius: 12px;
      --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }

    /* Header */
    header {
      background: linear-gradient(135deg, #0f2447 0%, #1a3a6b 50%, #2d5aa0 100%);
      color: #fff;
      padding: 1.25rem 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem 1.25rem;
    }
    .title {
      flex: 1 1 auto;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .filename {
      display: block;
      margin-top: 0.2rem;
      font-size: 0.82rem;
      color: rgba(255,255,255,0.6);
      font-weight: 400;
    }

    /* Buttons */
    .header-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .back-btn {
      background: rgba(255,255,255,0.12);
      color: #fff;
    }
    .back-btn:hover { background: rgba(255,255,255,0.22); }
    .download-btn {
      background: #c8913a;
      color: #fff;
    }
    .download-btn:hover { background: #b07e2f; }

    /* Viewer */
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 1.5rem;
    }
    #viewer {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow-md);
      overflow-x: auto;
      font-family: 'Noto Sans KR', monospace;
      font-size: 0.9rem;
      line-height: 1.8;
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
    }
    #message {
      margin: 2rem auto;
      max-width: 960px;
      padding: 1.25rem 1.5rem;
      border-radius: var(--radius);
      border: 1px solid #fecaca;
      background: #fef2f2;
      color: #991b1b;
      font-size: 0.9rem;
    }

    /* Footer */
    .site-footer {
      max-width: 960px;
      margin: 2rem auto 0;
      padding: 1.5rem 0;
      font-size: 0.82rem;
      color: var(--text-muted);
      text-align: center;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 768px) {
      header { padding: 1rem 1.25rem; }
      .container { padding: 1rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">정간보 미리보기<span id="current-file" class="filename"></span></div>
    <a class="header-btn back-btn" href="index.html">← 목록</a>
    <a id="download-link" class="header-btn download-btn" href="#" download>다운로드</a>
  </header>
  <div id="message" hidden></div>
  <div class="container">
    <pre id="viewer"></pre>
  </div>
  <footer class="site-footer">© 2025 Jeongganbo Dataset. 제작자: 한단비내린</footer>
  <script>
    (async function() {
      const params = new URLSearchParams(window.location.search);
      const fileParam = params.get('file');
      if (!fileParam) {
        showError('불러올 정간보 파일 경로가 제공되지 않았습니다.');
        return;
      }

      const requestUrl = fileParam;
      const decodedName = decodeURIComponent(requestUrl.split('/').pop() || '');

      const downloadLink = document.getElementById('download-link');
      downloadLink.href = requestUrl;
      downloadLink.setAttribute('download', decodedName || 'jeongganbo.txt');

      const currentFileEl = document.getElementById('current-file');
      currentFileEl.textContent = decodedName;
      if (decodedName) {
        document.title = `정간보 미리보기 - ${decodedName}`;
      }

      try {
        const response = await fetch(requestUrl);
        if (!response.ok) {
          throw new Error('파일을 불러올 수 없습니다. (HTTP ' + response.status + ')');
        }
        const text = await response.text();
        renderText(text);
      } catch (err) {
        console.error(err);
        showError('정간보를 불러오는 동안 오류가 발생했습니다. 파일 경로나 형식을 확인하세요.');
      }

      function showError(msg) {
        const messageEl = document.getElementById('message');
        messageEl.textContent = msg;
        messageEl.hidden = false;
        document.getElementById('viewer').style.display = 'none';
      }

      function renderText(text) {
        const viewer = document.getElementById('viewer');
        viewer.textContent = text;
      }
    })();
  </script>
</body>
</html>
